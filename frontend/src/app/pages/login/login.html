<div class="bg-secondary-subtle d-flex justify-content-center align-items-center vh-100">
    <div class="bg-light shadow border-0 rounded-2 p-4 mb-5">
        <div>
            <label class="mb-1">Username</label>
            <input type="text" class="form-control mb-3" placeholder="Username" [(ngModel)]="username">

            <label class="mb-1">Password</label>
            <input [type]="isPasswordHidden ? 'password' : 'text'" class="form-control mb-3" placeholder="Password" [(ngModel)]="password">

            <div class="form-switch mb-3">
                <input type="checkbox" id="showPasswordSwitch" (change)="onCheckBox()">
                <label class="text-muted ms-2" for="showPasswordSwitch">Show password</label>
            </div>
        </div>
        <div class="d-flex justify-content-center">
            <button class="btn text-white rounded-3" style="background-color: #df185b;" (click)="onLogin()">Log in</button>
            <button class="btn btn-outline-secondary rounded-3 ms-2" (click)="onRegister()">Register</button>
        </div>
    </div>
</div>
